#Uses the official Maven image matching the pom.xml Java version (21) for consistent local and CI builds. Operates on shared Docker runners using the mandatory shared-docker-runner tag.

image: maven:3.9-eclipse-temurin-21

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

stages:
  - test
  - deploy

test:
  stage: test
  tags:
    - shared-docker-runner
  script:
    - cd tut-project
    - mvn -B clean test org.pitest:pitest-maven:mutationCoverage
  artifacts:
    paths:
      - tut-project/target/site/jacoco/
      - tut-project/target/pit-reports/
    expire_in: 1 day

pages:
  stage: deploy
  tags:
    - shared-docker-runner
  needs:
    - test
  script:
    - mkdir -p public
    - cp -r tut-project/target/site/jacoco public/jacoco
    - cp -r tut-project/target/pit-reports public/pit
    - cp tut-project/pages/index.html public/
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH