#Uses the official Maven image matching the pom.xml Java version (21) for consistent local and CI builds. Operates on shared Docker runners using the mandatory shared-docker-runner tag.

image: maven:3.9-eclipse-temurin-21

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

stages:
  - test

test:
  stage: test
  tags:
    - shared-docker-runner
  script:
    - cd tut-project
    - mvn -B test
  